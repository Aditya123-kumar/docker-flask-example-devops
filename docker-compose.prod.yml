services:

  web-blue:
    build:
      context: .
      target: app
      args:
        APP_UID: 1000
        APP_GID: 1000
        FLASK_DEBUG: "false"
        NODE_ENV: production
    env_file:
      - .env
    environment:
      FLASK_DEBUG: "false"
      NODE_ENV: production
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      - production
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/up/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  web-green:
    build:
      context: .
      target: app
      args:
        APP_UID: 1000
        APP_GID: 1000
        FLASK_DEBUG: "false"
        NODE_ENV: production
    env_file:
      - .env
    environment:
      FLASK_DEBUG: "false"
      NODE_ENV: production
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      - production
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/up/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_prod:/var/lib/postgresql
    restart: unless-stopped
    networks:
      - production

  redis:
    image: redis:8.10.1-trixie
    volumes:
      - redis_prod:/data
    restart: unless-stopped
    networks:
      - production

  nginx:
    image: nginx:alpine
    container_name: flask-nginx
    ports:
      - "8081:80"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - production

networks:
  production:

volumes:
  postgres_prod:
  redis_prod: